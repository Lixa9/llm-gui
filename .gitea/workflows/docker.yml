name: Build & Push Docker Image

on:
  push:

env:
  REGISTRY: git.control.lan
  IMAGE: ${{ gitea.repository }} # owner/job-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llm_gui_test
          POSTGRES_USER: llm_gui
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U llm_gui -d llm_gui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Test server
        working-directory: server
        env:
          GENERATION_TEST_DATABASE_URL: postgres://llm_gui:test@postgres:5432/llm_gui_test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:integration

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run check
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest # change to match your runner's registered label

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGE  }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          no-cache: true
