name: CI & Publish

on:
  push:
  pull_request:

env:
  REGISTRY: git.control.lan
  IMAGE: ${{ gitea.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llm_gui_test
          POSTGRES_USER: llm_gui
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U llm_gui -d llm_gui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Test server
        working-directory: server
        env:
          GENERATION_TEST_DATABASE_URL: postgres://llm_gui:test@postgres:5432/llm_gui_test
        run: |
          npm ci
          npm audit --omit=dev --ignore-scripts
          npm run typecheck
          npm test
          npm run test:integration

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --ignore-scripts
          npm test
          npm run check
          npm run build

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea container registry
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGE }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ gitea.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
