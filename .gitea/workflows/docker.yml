name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: act-1
    steps:
      - name: Checkout
        run: |
          git config --global http.sslVerify false
          git clone --depth 1 --branch main \
            https://git.control.lan/Nico/llm-gui.git .

      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login git.control.lan \
            -u ${{ github.actor }} --password-stdin
          docker build \
            -t git.control.lan/nico/llm-gui:latest \
            -t git.control.lan/nico/llm-gui:${{ github.sha }} \
            .
          docker push git.control.lan/nico/llm-gui:latest
          docker push git.control.lan/nico/llm-gui:${{ github.sha }}
