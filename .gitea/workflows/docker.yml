name: Build & Push Docker Image

on:
  push:
    branches: [main]

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: docker buildx create --use --name builder || docker buildx use builder

      - name: Login to registry
        run: echo "${{ secrets.GITEA_TOKEN }}" | docker login git.control.lan -u "${{ gitea.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx build \
            --push \
            --tag git.control.lan/nico/llm-gui:latest \
            --cache-from type=registry,ref=git.control.lan/nico/llm-gui:buildcache \
            --cache-to type=registry,ref=git.control.lan/nico/llm-gui:buildcache,mode=max \
            .
