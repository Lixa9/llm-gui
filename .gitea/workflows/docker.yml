name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: git.control.lan
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: git.control.lan/nico/llm-gui:latest
          cache-from: type=registry,ref=git.control.lan/nico/llm-gui:buildcache
          cache-to: type=registry,ref=git.control.lan/nico/llm-gui:buildcache,mode=max
