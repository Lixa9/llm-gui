name: Build & Push Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llm_gui_test
          POSTGRES_USER: llm_gui
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_gui -d llm_gui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Test server
        working-directory: server
        env:
          GENERATION_TEST_DATABASE_URL: postgres://llm_gui:test@127.0.0.1:5432/llm_gui_test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:integration

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run check
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lixa9/llm-gui:latest
            ghcr.io/lixa9/llm-gui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
