services:
  chat:
    build: .
    # Or use the pre-built image from GitHub Container Registry:
    # image: ghcr.io/lixa9/llm-gui:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./config:/app/config
    environment:
      # Only needed if config.yaml references ${OIDC_CLIENT_SECRET}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Optional — enable a local admin account (omit both to disable)
      # Accepts plain text or an argon2/bcrypt hash for LOCAL_ADMIN_PASSWORD
      LOCAL_AUTH: "true"
    restart: unless-stopped
