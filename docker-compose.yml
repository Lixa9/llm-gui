services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llm_gui
      POSTGRES_USER: llm_gui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gui -d llm_gui"]
      interval: 5s
      timeout: 5s
      retries: 10
  chat:
    build: .
    # Or use the pre-built image from GitHub Container Registry:
    # image: ghcr.io/lixa9/llm-gui:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config:ro
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgres://llm_gui:${POSTGRES_PASSWORD}@postgres:5432/llm_gui
      # Optional test-only fallback. Keep disabled in normal use.
      LOCAL_AUTH: ${LOCAL_AUTH:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
