apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gui-config
  labels:
    app: llm-gui
data:
  config.yaml: |
    app:
      name: "Chat"
      base_url: "${BASE_URL}"

    openai:
      base_url: "${OPENAI_BASE_URL}"
      api_key: "${OPENAI_API_KEY}"

    database:
      path: "/data/chat.db"

    # Uncomment and fill in if using OIDC SSO login.
    # oidc:
    #   issuer: "https://auth.example.com"
    #   client_id: "chat"
    #   client_secret: "${OIDC_CLIENT_SECRET}"

    rbac:
      group_claim: "groups"
      mappings:
        - oidc_group: "admins"
          role: admin
      default_role: user

    rate_limits:
      requests_per_minute: 60
      requests_per_hour: 300
      concurrent_streams: 2

    conversation:
      auto_title: true
      auto_title_model: "gpt-4o-mini"
      context_window_tokens: 100000

  models.yaml: |
    models: []

  prompts.yaml: |
    prompts:
      - name: "Concise assistant"
        content: "You are a helpful assistant. Keep responses short and to the point."
        allowed_roles: [admin, user]

      - name: "Code reviewer"
        content: "You are an expert code reviewer. Focus on correctness, security, and clarity."
        allowed_roles: [admin, user]

  presets.yaml: |
    presets: []

  automations.yaml: |
    automations: []
