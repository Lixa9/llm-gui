app:
  name: "Chat"
  base_url: "http://localhost:3000"

openai:
  base_url: "http://127.0.0.1:1234/v1"
  api_key: "${OPENAI_API_KEY}"

storage:
  # Per-user upload quota; use values such as "10G". 0 means unlimited.
  quota: "500M"

# OIDC is only needed if you want SSO login.
# If you only use the local admin account, these values are never contacted.
oidc:
  issuer: "https://auth.example.com"
  client_id: "chat"
  client_secret: "placeholder"

rbac:
  group_claim: "groups"
  mappings:
    - oidc_group: "admins"
      role: admin
  default_role: user

rate_limits:
  requests_per_minute: 120
  requests_per_hour: 1000
  concurrent_streams: 4

conversation:
  auto_title: true
  auto_title_model: "qwen3.5-0.8b"
  # Durable generations are restarted after a lost worker lease. The duration
  # limits bound each attempt; max_attempts applies to upstream failures, not
  # worker-loss recovery.
  generation_max_duration_ms: 1800000
  generation_idle_timeout_ms: 120000
  generation_max_attempts: 3
