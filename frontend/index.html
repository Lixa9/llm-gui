<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0d0d0d; color: #e8e8e8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
      }
      #sk { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      #sk-top {
        height: 48px; min-height: 48px; flex-shrink: 0;
        background: #161616; border-bottom: 1px solid #2a2a2a;
        display: flex; align-items: center; padding: 0 16px; gap: 14px;
      }
      #sk-logo { width: 40px; height: 14px; background: #2a2a2a; border-radius: 3px; }
      #sk-nav { display: flex; gap: 6px; }
      .sk-pill { width: 54px; height: 22px; background: #1e1e1e; border-radius: 4px; }
      .sk-pill:first-child { background: #242424; }
      #sk-spacer { flex: 1; }
      #sk-avatar { width: 26px; height: 26px; border-radius: 50%; background: rgba(124,106,247,0.2); }
      #sk-body { flex: 1; display: flex; overflow: hidden; }
      #sk-sidebar {
        width: 260px; min-width: 260px; flex-shrink: 0;
        background: #161616; border-right: 1px solid #2a2a2a;
        padding: 10px; display: flex; flex-direction: column; gap: 7px;
      }
      #sk-btn { height: 32px; background: rgba(124,106,247,0.3); border-radius: 4px; }
      #sk-srch { height: 28px; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 4px; margin-top: 2px; }
      .sk-row { height: 36px; background: #1a1a1a; border-radius: 4px; }
      .sk-row.w80 { width: 80%; }
      .sk-row.w65 { width: 65%; }
      #sk-main {
        flex: 1; background: #0d0d0d; min-width: 0;
        display: flex; flex-direction: column; align-items: center;
        justify-content: flex-end; padding: 16px; gap: 10px;
      }
      .sk-msg { border-radius: 8px; background: #161616; flex-shrink: 0; }
      .sk-msg.a { width: min(540px, 88%); height: 60px; align-self: flex-start; }
      .sk-msg.u { width: min(260px, 65%); height: 36px; align-self: flex-end; background: rgba(124,106,247,0.12); border: 1px solid rgba(124,106,247,0.18); }
      .sk-msg.a2 { width: min(420px, 80%); height: 44px; align-self: flex-start; }
      #sk-comp {
        width: 100%; max-width: 720px; height: 52px;
        background: #161616; border: 1px solid #2a2a2a; border-radius: 8px;
        margin-top: 4px; flex-shrink: 0;
      }
      @keyframes sk-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
      #sk-logo,.sk-pill,#sk-avatar,#sk-btn,#sk-srch,.sk-row,.sk-msg,#sk-comp {
        animation: sk-pulse 1.8s ease-in-out infinite;
      }
      body.svelte-mounted #sk { display: none; }
    </style>
  </head>
  <body>
    <div id="sk" aria-hidden="true">
      <div id="sk-top">
        <div id="sk-logo"></div>
        <div id="sk-nav">
          <div class="sk-pill"></div>
          <div class="sk-pill"></div>
          <div class="sk-pill"></div>
          <div class="sk-pill"></div>
        </div>
        <div id="sk-spacer"></div>
        <div id="sk-avatar"></div>
      </div>
      <div id="sk-body">
        <div id="sk-sidebar">
          <div id="sk-btn"></div>
          <div id="sk-srch"></div>
          <div class="sk-row"></div>
          <div class="sk-row w80"></div>
          <div class="sk-row w65"></div>
          <div class="sk-row"></div>
          <div class="sk-row w80"></div>
          <div class="sk-row w65"></div>
        </div>
        <div id="sk-main">
          <div class="sk-msg a"></div>
          <div class="sk-msg u"></div>
          <div class="sk-msg a2"></div>
          <div class="sk-msg u" style="width:min(200px,55%)"></div>
          <div id="sk-comp"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
