<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chat</title>
    <style>
      :root {
        --bg-base: #0d0d0d; --bg-surface: #161616; --bg-elevated: #1e1e1e;
        --bg-hover: #242424; --border: #2a2a2a; --border-subtle: #1f1f1f;
        --text-primary: #e8e8e8; --text-secondary: #888; --text-muted: #555;
        --accent: #7c6af7; --accent-hover: #6b59e8;
        --accent-subtle: rgba(124, 106, 247, 0.12);
        --danger: #e05252; --danger-hover: #c94444;
        --success: #4caf78; --warning: #e0a050; --code-bg: #111;
        --radius: 8px; --radius-sm: 4px; --radius-lg: 12px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace;
        --sidebar-width: 260px; --topbar-height: 48px;
        --shadow: 0 4px 24px rgba(0,0,0,0.5); --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg-base); color: var(--text-primary);
        font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
